<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Something Went Wrong — TAL Chess Academy</title>
  <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
  <style>
    /*
      Deliberately self-contained: doesn't extend the site's base template
      or load static files or external fonts. Django renders this with zero
      context during a real server error, and an error page shouldn't
      depend on the machinery that might be the thing that's broken.
    */
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #14120f;
      color: #f6f2e8;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      text-align: center;
      padding: 1.5rem;
      box-sizing: border-box;
    }
    .wrap { max-width: 32rem; }
    .eyebrow {
      font-size: 0.75rem;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: #b8935f;
      margin-bottom: 1rem;
    }
    h1 {
      font-family: Georgia, "Times New Roman", serif;
      font-size: 2rem;
      font-weight: 500;
      margin: 0 0 1rem;
    }
    p {
      color: #b6ae9e;
      line-height: 1.6;
      margin: 0 0 2rem;
    }
    a.btn {
      display: inline-block;
      padding: 0.85rem 1.75rem;
      background: #b8935f;
      color: #14120f;
      text-decoration: none;
      font-size: 0.8125rem;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      border-radius: 2px;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <p class="eyebrow">TAL Chess Academy</p>
    <h1>Something went wrong on our end.</h1>
    <p>This has been logged and we'll look into it. In the meantime, head back to the homepage.</p>
    <a class="btn" href="/">Back to Home</a>
  </div>
</body>
</html>

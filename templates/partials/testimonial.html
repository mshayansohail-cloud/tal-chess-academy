{% comment %} Expects: testimonial (dict) {% endcomment %}
<figure class="testimonial">
  <span class="testimonial__mark" aria-hidden="true">&ldquo;</span>
  <blockquote class="testimonial__quote">{{ testimonial.quote }}</blockquote>
  <figcaption class="testimonial__attribution">
    <div class="testimonial__name">{{ testimonial.name }}</div>
    <div class="testimonial__role">{{ testimonial.role }}</div>
  </figcaption>
</figure>
